<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- interactive-widget=resizes-content: sin esto, Android Chrome achica solo
         el viewport visual al abrir el teclado (no el de layout), y los elementos
         position:fixed/absolute (tab bar, desplegable de búsqueda) quedan
         posicionados contra el tamaño completo, ocultos detrás del teclado hasta
         que se cierra. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>SWAI ERP · Stock y Precios</title>
  </head>
  <body class="saas-mobile">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
