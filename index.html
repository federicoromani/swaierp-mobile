<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- interactive-widget=resizes-content: sin esto, Android Chrome achica solo
         el viewport visual al abrir el teclado (no el de layout), y los elementos
         position:fixed/absolute (tab bar, desplegable de búsqueda) quedan
         posicionados contra el tamaño completo, ocultos detrás del teclado hasta
         que se cierra.
         Sin maximum-scale/user-scalable=no: el zoom con dos dedos queda
         disponible (accesibilidad). El zoom automático de iOS al enfocar un
         campo se evita con inputs de 16px, y el doble toque con
         touch-action: manipulation (ver styles/main.css). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>SWAI ERP · Stock y Precios</title>
  </head>
  <body class="saas-mobile">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
